<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material Symbols</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>body{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;color:#242424;background:#fff}header{padding:18px 16px 10px;border-bottom:1px solid #eee}h2{margin:0 0 12px;font-size:18px}input,select,button{font:inherit}#q{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:6px}.options{display:flex;gap:8px;padding:12px 16px;align-items:center}.options select{flex:1;min-width:0;padding:7px}.options input{width:42px;height:34px;border:0;background:none}.options label{font-size:12px}.status{padding:0 16px 10px;color:#666;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:0 14px 18px;max-height:calc(100vh - 215px);overflow:auto}.tile{height:75px;border:1px solid #eee;background:#fafafa;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden}.tile:hover,.tile:focus{border-color:#6750a4;background:#f3edff}.tile img{width:30px;height:30px}.tile span{font-size:9px;color:#555;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;box-sizing:border-box}.help{padding:12px 16px;font-size:11px;color:#666;border-top:1px solid #eee}button.more{margin:0 16px 12px;padding:9px;width:calc(100% - 32px);background:#eee;border:0;border-radius:6px;cursor:pointer}
.options {
  flex-wrap: wrap;
}

.colour-controls {
  width: 100%;
}

.theme-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 9px;
}

#refresh-theme {
  border: 0;
  background: #f1f1f1;
  border-radius: 5px;
  cursor: pointer;
  padding: 4px 9px;
}

.theme-swatches {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 5px;
}

.theme-swatch {
  width: 100%;
  aspect-ratio: 1;
  border: 1px solid #ccc;
  border-radius: 5px;
  cursor: pointer;
  padding: 0;
}

.theme-swatch.active {
  outline: 2px solid #333;
  outline-offset: 2px;
}

.theme-message {
  font-size: 11px;
  color: #777;
  margin-top: 7px;
}

.custom-colour {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}
</style></head><body><header><h2>Material Symbols</h2><input id="q" placeholder="Search icons, e.g. home, analytics…" autofocus></header><div class="options"><select id="style"><option value="outlined">Outlined</option><option value="rounded">Rounded</option><option value="sharp">Sharp</option></select><div class="colour-controls">
  <div class="theme-heading">
    <span>Presentation theme colours</span>
    <button type="button" id="refresh-theme" title="Refresh theme colours">↻</button>
  </div>
  <div id="theme-colours" class="theme-swatches"></div>
  <div id="theme-message" class="theme-message"></div>
  <label class="custom-colour">
    Custom colour
    <input type="color" id="color" value="#222222">
  </label>
</div></div><div class="status" id="status">Loading icon catalogue…</div><div class="grid" id="grid"></div><button class="more" id="more" hidden>Show more</button><div class="help">Click an icon to insert a scalable SVG into the selected slide. Icons are loaded from your own GitHub Pages site.</div><script src="taskpane.js"></script></body></html>
